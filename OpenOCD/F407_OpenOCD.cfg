# STM32F407 OpenOCD 配置文件
# 兼容两种仿真器：CMSIS-DAP(DAPLink) / ST-LINK V2/V3
#
# 外部可传入参数：
# 1. ADAPTER_TYPE = daplink / stlink  不传入默认 daplink
# 2. ADAPTER_KHZ   烧录速率，默认2000(2MHz)
#
# 启动示例：
# 1. 默认 DAPLink (原逻辑)
# openocd -f F407_OpenOCD.cfg
# 2. 使用 ST-LINK
# openocd -c "set ADAPTER_TYPE stlink" -f F407_OpenOCD.cfg
# 3. ST-LINK + 自定义速率1MHz
# openocd -c "set ADAPTER_TYPE stlink; set ADAPTER_KHZ 1000" -f F407_OpenOCD.cfg

# ====================== 全局烧录速率配置（保留原有逻辑） ======================
if { ![info exists ADAPTER_KHZ] } {
    set ADAPTER_KHZ 2000
}

# ====================== 根据仿真器类型自动加载对应接口 ======================
if { [info exists ADAPTER_TYPE] && $ADAPTER_TYPE eq "stlink" } {
    # ST-LINK V2 / V3 接口驱动
    source [find interface/stlink.cfg]
} else {
    # 默认 CMSIS-DAP / DAPLink
    source [find interface/cmsis-dap.cfg]
}

# 统一使用 SWD 调试协议（STLINK、DAPLink均支持）
transport select swd

# 应用自定义/默认烧录时钟
adapter speed $ADAPTER_KHZ

# ====================== 目标芯片 & 复位配置（完全沿用你原有参数） ======================
source [find target/stm32f4x.cfg]

# 复位模式：none separate 保持不变
reset_config none separate